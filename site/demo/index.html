<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live demo · Dapload</title>
  <meta name="description" content="Try Dapload in your browser against a pretend Shanling M1 Plus. Nothing is uploaded anywhere.">
  <link rel="canonical" href="https://dapload.com/demo/">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var s = null; try { s = localStorage.getItem("site-theme"); } catch (e) {}
      document.documentElement.classList.toggle("dark", s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
    })();
  </script>
  <link rel="stylesheet" href="../site.css">
</head>
<body class="demo-page">
  <div class="strip" role="toolbar" aria-label="Demo controls">
    <a class="brand" href="../"><span id="demo-url-led" class="led on" aria-hidden="true"></span>Dapload</a>
    <button id="demo-reset" class="btn btn-sm" type="button"><svg data-icon="reset"></svg>Reset</button>
    <button id="demo-offline" class="btn btn-sm" type="button" aria-pressed="false"><svg data-icon="power"></svg><span>Simulate player going offline</span></button>
    <div class="seg" role="group" aria-label="Demo theme">
      <button id="demo-light" type="button" aria-pressed="true" aria-label="Light"><svg data-icon="sun"></svg></button>
      <button id="demo-dark" type="button" aria-pressed="false" aria-label="Dark"><svg data-icon="moon"></svg></button>
    </div>
    <div class="spacer"></div>
    <span class="strip-note">Demo: files stay in your browser, only names and sizes are kept.</span>
  </div>
  <iframe id="demo-iframe" title="Live demo of Dapload" data-app-base="app/" data-mock-src="mock-backend.js" data-eager="1"></iframe>
  <script src="demo-host.js" defer></script>
  <script src="../site.js" defer></script>
</body>
</html>
