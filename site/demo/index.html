<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live demo · Dapload</title>
  <meta name="description" content="Try Dapload in your browser against a pretend Shanling M1 Plus. Nothing is uploaded anywhere.">
  <link rel="canonical" href="https://dapload.com/demo/">
  <meta property="og:url" content="https://dapload.com/demo/">
  <meta property="og:title" content="Live demo · Dapload">
  <meta property="og:description" content="Try Dapload in your browser against a pretend Shanling M1 Plus. Nothing is uploaded anywhere.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dapload">
  <meta property="og:image" content="https://dapload.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Dapload: a better WiFi Transfer for the Shanling M1 Plus. A drawing of the player next to the app.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var s = null; try { s = localStorage.getItem("site-theme"); } catch (e) {}
      document.documentElement.classList.toggle("dark", s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
    })();
  </script>
  <link rel="stylesheet" href="../site.css">
</head>
<body class="demo-page">
  <div class="strip" role="toolbar" aria-label="Demo controls">
    <a class="brand" href="../"><span id="demo-url-led" class="led on" aria-hidden="true"></span>Dapload</a>
    <button id="demo-reset" class="btn btn-sm" type="button" data-event="demo_used" data-event-control="reset"><svg data-icon="reset"></svg>Reset</button>
    <button id="demo-offline" class="btn btn-sm" type="button" aria-pressed="false" data-event="demo_used" data-event-control="offline"><svg data-icon="power"></svg><span>Simulate player going offline</span></button>
    <div class="seg" role="group" aria-label="Demo theme">
      <button id="demo-light" type="button" aria-pressed="true" aria-label="Light" data-event="demo_used" data-event-control="theme"><svg data-icon="sun"></svg></button>
      <button id="demo-dark" type="button" aria-pressed="false" aria-label="Dark" data-event="demo_used" data-event-control="theme"><svg data-icon="moon"></svg></button>
    </div>
    <div class="spacer"></div>
    <span class="strip-note">Demo: files stay in your browser, only names and sizes are kept.</span>
  </div>
  <main class="demo-main">
    <h1 class="visually-hidden">Live demo of Dapload</h1>
  <iframe id="demo-iframe" title="Live demo of Dapload" data-app-base="app/" data-mock-src="mock-backend.js" data-eager="1"></iframe>
  </main>
  <script src="demo-host.js" defer></script>
  <script src="../site.js" defer></script>
  <!-- Vercel Web Analytics and Speed Insights, served from this domain. Cookieless. -->
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
