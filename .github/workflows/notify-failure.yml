name: Notify on failure

# When one of the workflows below fails on main (a push, a schedule or a
# manual run), open an issue labelled ci-red for it. GitHub notifies the
# owner (the @mention makes sure). While that issue is open, later failures
# of the same workflow add nothing, so a frequent schedule can't flood the
# inbox: close the issue once the cause is fixed. The job runs only when a
# run failed, so it costs no Actions minutes otherwise (skipped jobs are
# free). Add new workflows to the list; workflow_run matches them by name.
on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
    branches: [main]

permissions:
  issues: write

jobs:
  notify:
    if: contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      RESULT: ${{ github.event.workflow_run.conclusion }}
      EVENT: ${{ github.event.workflow_run.event }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Open a ci-red issue unless one is open for this workflow
        run: |
          gh label create ci-red --color B60205 --description "A workflow is failing on main" --force >/dev/null
          export TITLE="Failing on main: $WORKFLOW"
          open=$(gh issue list --label ci-red --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.TITLE))[0].number // empty')
          if [ -n "$open" ]; then
            echo "Issue #$open is already open for $WORKFLOW; not notifying again."
            exit 0
          fi
          gh issue create --title "$TITLE" --label ci-red --body "The workflow **$WORKFLOW** ended with **$RESULT** on main (${SHA:0:7}, $EVENT): $RUN_URL

          Later failures of this workflow won't notify again while this issue is open. Close it once the cause is fixed. @$OWNER"
