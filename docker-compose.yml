services:
  dapload:
    image: ghcr.io/admonish/dapload:latest
    # or build from source instead:
    # build: .
    container_name: dapload
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      # Optional. You can also enter (and later change) the address in the web UI.
      # DEVICE: "192.168.1.23:8888"

      # Optional. You can connect a NAS from the web page instead. Use these only to
      # serve a folder on this machine (e.g. an NFS mount) as the library.
      # LIBRARY_DIR: "/music"
      # LIBRARY_NAME: "NAS"
    volumes:
      - dapload-data:/data
      # - /path/to/your/music:/music:ro

volumes:
  dapload-data:
